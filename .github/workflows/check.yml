name: Check
on:
  push:
    branches: [main, refactor/agent-enhance]
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        pi-version: ['0.86.1', latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use latest Pi SDK and TUI
        if: matrix.pi-version == 'latest'
        run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-coding-agent@latest @earendil-works/pi-tui@latest
      - name: Verify Pi SDK and TUI versions
        env:
          PI_VERSION: ${{ matrix.pi-version }}
        run: |
          node -e "const assert = require('node:assert/strict'); const pi = require('./node_modules/@earendil-works/pi-coding-agent/package.json').version; const tui = require('./node_modules/@earendil-works/pi-tui/package.json').version; console.log({ pi, tui }); assert.equal(pi, tui); if (process.env.PI_VERSION !== 'latest') assert.equal(pi, process.env.PI_VERSION)"
      - run: npm run format:check
      - run: npm run check
      - run: git diff --exit-code -- dist
